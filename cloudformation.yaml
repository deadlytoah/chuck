AWSTemplateFormatVersion: "2010-09-09"
Description: S3 bucket and DynamoDB table for chuck application

Parameters:
  HostedZoneName:
    Type: String
    Description: The DNS name of an existing Amazon Route 53 hosted zone (e.g. overcomingsh.in.)
    Default: overcomingsh.in.
  AcmCertificateArn:
    Type: String
    Description: ARN of ACM cert for chuck.overcomingsh.in (must be in us-east-1)
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda deployment package (e.g., lambda.zip)

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: chuck.overcomingsh.in
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - Authorization
              - X-Requested-With
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArchivedItems
            Prefix: images/
            Status: Enabled
            ExpirationInDays: 30

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${S3Bucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub
                  "arn:aws:cloudfront::${AWS::AccountId}:\
                   distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: chuck-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: chuck web app
        Aliases:
          - chuck.overcomingsh.in
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt S3Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
        CacheBehaviors:
          - PathPattern: "*.html"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2

  DynamoDBTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: chuck-items-v2
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  LambdaLogGroupV2:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/chuck-api-v2
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chuck-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: chuck-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${S3Bucket.Arn}/images/*"
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt DynamoDBTableV2.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/chuck-api-v2:*"

  ChuckApiFunctionV2:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroupV2
    Properties:
      FunctionName: chuck-api-v2
      Runtime: provided.al2
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket
          TABLE_NAME: !Ref DynamoDBTableV2
          REGION: !Ref AWS::Region
      Timeout: 30
      MemorySize: 512
      Architectures:
        - arm64

  ChuckApiFunctionUrlV2:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt ChuckApiFunctionV2.Arn
      Cors:
        AllowOrigins:
          - "https://chuck.overcomingsh.in"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 300

  ChuckApiFunctionUrlPermissionV2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChuckApiFunctionV2
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ChuckApiFunctionInvokePermissionV2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChuckApiFunctionV2
      Action: lambda:InvokeFunction
      Principal: "*"

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: !Sub "${S3Bucket}."
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  BucketName:
    Value: !Ref S3Bucket
    Description: Name of the S3 bucket
  TableName:
    Value: !Ref DynamoDBTableV2
    Description: Name of the DynamoDB table
  FunctionUrl:
    Value: !GetAtt ChuckApiFunctionUrlV2.FunctionUrl
    Description: Lambda Function URL for API access
  WebsiteURL:
    Value: "https://chuck.overcomingsh.in"
    Description: HTTPS URL for the web app
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront distribution ID (for cache invalidation)
